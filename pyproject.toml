[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-biology"
version = "0.1.0"
description = "AMP decision benchmarks, evaluation controls, and a joint-encoder cell prototype"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "transformers==4.57.6", "numpy>=2,<3", "pandas>=2,<3", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
arc = ["anndata>=0.11,<0.13"]
benchmark = ["rdkit>=2025.3,<2027"]

[tool.setuptools.packages.find]
include = ["aster*"]
